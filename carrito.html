<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./assest/css/output.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
  <script src="./assest/js/filtros.js" defer></script>
  <script src="./assest/js/carrito.js" defer></script>
  <title>PetCare | Carrito</title>
</head>
<body>

    <header class="flex flex-wrap lg:justify-start lg:flex-nowrap z-50 w-full py-4 bg-white border-b border-gray-200">
    <nav class="relative max-w-7xl w-full flex flex-wrap lg:grid lg:grid-cols-12 basis-full items-center px-4 md:px-6 lg:px-8 mx-auto">
        <div class="lg:col-span-3 flex items-center">
        <!-- Logo fixed -->
        <a class="flex-none rounded-xl text-xl inline-block font-semibold focus:outline-none focus:opacity-80" href="index.html" aria-label="Preline">
            <img class="h-14 w-auto object-contain" src="./assest/images/isotipo.png" alt="Logo Veterinaria">
        </a>
        <!-- End Logo fixed-->
        </div>

        <!-- Button Group -->
        <!-- boton buscar -->
        <div class="flex items-center gap-x-1 lg:gap-x-2 ms-auto py-1 lg:ps-6 lg:order-3 lg:col-span-3">
        <form action="productos.html" method="GET" class="relative flex items-center">
            <input type="text" name="buscar" placeholder="Busca un producto" class="size-9.5 focus:w-48 w-9.5 transition-all duration-300 ease-in-out pl-3 pr-8 text-xs rounded-xl bg-gray-100 border border-gray-200 text-gray-800 focus:outline-none focus:ring-2 focus:ring-teal-700 cursor-pointer focus:cursor-text"/>
            <button type="submit" class="absolute right-0 size-9.5 flex justify-center items-center text-gray-800 hover:text-teal-700 focus:outline-none pointer-events-none">
                <span class="sr-only">Search</span>
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"  stroke-linejoin="round">
                    <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>
                </svg>
            </button>
        </form>
        <!-- fin boton buscar -->

        <!-- boton carrito -->
        <a href="carrito.html " class="size-9.5 relative flex justify-center items-center rounded-xl bg-gray-100 border border-gray-200 text-gray-800 hover:bg-gray-200 focus:outline-none">
            <span class="sr-only">Carrito</span>
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" >
                <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
            </svg>
        </a>
        <!-- boton inciar sesion -->
        <a href="login.html" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-xl bg-teal-700 text-white hover:bg-teal-800 focus:outline-none transition">
            Iniciar sesión
        </a>

        <div class="lg:hidden">
            <button type="button" class="hs-collapse-toggle size-9.5 flex justify-center items-center text-sm font-semibold rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none" id="hs-pro-hcail-collapse" aria-expanded="false" aria-controls="hs-pro-hcail" aria-label="Toggle navigation" data-hs-collapse="#hs-pro-hcail">
            <svg class="hs-collapse-open:hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
            <svg class="hs-collapse-open:block hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        </div>
        <!-- End Button Group -->

        <!-- Collapse -->
        <div id="hs-pro-hcail" class="hs-collapse hidden overflow-hidden transition-all duration-300 basis-full grow lg:block lg:w-auto lg:basis-auto lg:order-2 lg:col-span-6" aria-labelledby="hs-pro-hcail-collapse" role="region">
        <div class="flex flex-col gap-y-4 gap-x-0 mt-5 lg:flex-row lg:justify-center lg:items-center lg:gap-y-0 lg:gap-x-7 lg:mt-0">
            <div>
            <a  class="relative inline-block text-foreground focus:outline-hidden " href="index.html" aria-current="page">Inicio</a>
            </div>
            <div>
            <a class="relative inline-block text-foreground focus:outline-hidden "  href="productos.html">Productos</a>
            </div>
            <div>
            <a class="relative inline-block text-foreground focus:outline-hidden "  href="aboutus.html">Nosotros</a>
            </div>
            <div>
            <a class="relative inline-block text-foreground focus:outline-hidden "  href="blogs.html">Blogs</a>
            </div>
            <div>
            <a class="relative inline-block text-foreground focus:outline-hidden "  href="contacto.html">Contacto</a>
            </div>
        </div>
        </div>
        <!-- End Collapse -->
    </nav>
    </header>

    <!-- titulo y subtitulo -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Tu carrito de compras</h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1">Revisa tus productos antes de finalizar la compra.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8">
                <div id="contenedor-carrito" class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm divide-y divide-gray-100">
                    <!--js-->
                </div>
            </div>

            <!--rESUMEN COMPRA  -->
            <div class="lg:col-span-4">
                <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm sticky top-6 space-y-4">
                    <h2 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-3">Detalle de compra</h2>

                    <div class="space-y-2 text-xs text-gray-600">
                        <div class="flex justify-between">
                            <span>Total a pagar</span>
                            <span id="subtotal-precio" class="font-semibold text-gray-800">$0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Impuestos IVA (19%)</span>
                            <span class="font-semibold text-gray-800">Incluido en el monto final</span>
                        </div>
                        <div class="flex justify-between border-t border-gray-100 pt-2 font-semibold">
                            <span>Subtotal (CLP)</span>
                            <span id="total-precio" class="text-amber-600">$0</span>
                        </div>
                    </div>
                    <button type="button" class="w-full py-3 px-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold text-xs rounded-xl shadow-sm transition active:scale-95">
                        Procer a pago
                    </button>
                </div>
            </div>
        </div>
    </main>


</body>
</html>
