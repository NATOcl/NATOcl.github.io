<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./assest/css/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <title>Contacto | Vet nato</title>
</head>
<body class="bg-[#f4f6f4]">
    <!-- ============= HEADER  =============== -->
    <header class="flex flex-wrap lg:justify-start lg:flex-nowrap z-50 w-full py-4 bg-white border-b border-gray-200">
        <nav class="relative max-w-7xl w-full flex flex-wrap lg:grid lg:grid-cols-12 basis-full items-center px-4 md:px-6 lg:px-8 mx-auto">

            <!-- ========= LOGO ========== -->
            <div class="lg:col-span-3 flex items-center">
                <a class="flex-none rounded-xl text-xl inline-block font-semibold focus:outline-none focus:opacity-80"  href="index.html">
                    <img class="h-14 w-auto object-contain"  src="./assest/images/isotipo.png" alt="Logo Veterinaria"></a>
            </div>
            
            <!-- ====== BOTONES ======= -->
            <div class="flex items-center gap-x-1 lg:gap-x-2 ms-auto py-1 lg:ps-6 lg:order-3 lg:col-span-3">

                <button type="button" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-xl bg-teal-700 text-white hover:bg-teal-800 transition">
                    Iniciar sesión
                </button>
            </div>


            <!-- ====== MENU ==========-->
            <div class="basis-full grow lg:block lg:w-auto lg:basis-auto lg:order-2 lg:col-span-6">
                <div class="flex flex-col gap-y-4 lg:flex-row lg:justify-center lg:items-center lg:gap-x-7 lg:mt-0">
                    <div>
                        <a class="relative inline-block text-foreground" href="index.html"> Inicio</a>
                    </div>

                    <div>
                        <a class="relative inline-block text-foreground" href="index.html"> Productos</a>
                    </div>

                    <div>
                        <a class="relative inline-block text-foreground" href="index.html"> Nosotros</a>
                    </div>


                    <div>
                        <a class="relative inline-block text-foreground" href="index.html"> Blogs </a>
                    </div>


                    <!-- ================= CONTACTO ACTIVO =========-->
                    <div>
                        <a class="relative inline-block text-teal-700 font-semibold"href="contacto.html"> Contacto</a>
                    </div>

                </div>

            </div>

        </nav>

    </header>


    <!-- CONTENIDO CONTACTO -->
    <main class="py-20">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h1 class="text-4xl sm:text-5xl font-bold text-gray-900 mb-4"> Contáctanos</h1>
                <p class="text-gray-600"> Estamos disponibles para ayudarte con cualquier consulta sobre tu mascota.</p>
            </div>

            <!-- FORMULARIO -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

                <form class="space-y-6">
                    <div>

                        <label for="nombre"class="block text-sm font-medium text-gray-700 mb-2"> Nombre
                        </label>

                        <input type="text" id="nombre" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none" placeholder="Ingresa tu nombre">
                    </div>

                    <div>

                        <label for="correo" class="block text-sm font-medium text-gray-700 mb-2"> Correo electrónico </label>

                        <input type="email" id="correo" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none" placeholder="ejemplo@correo.com">

                    </div>

                    <div>
                        <label for="número" class="block text-sm font-medium text-gray-700 mb-2">sadasd </label>
                    </div>


                    <div>

                        <label  for="mensaje" class="block text-sm font-medium text-gray-700 mb-2"> Mensaje </label>

                        <textarea  id="mensaje" rows="5" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none" placeholder="Escribe tu mensaje" ></textarea>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-xl bg-teal-700 text-white font-medium hover:bg-teal-800 transition" > Enviar mensaje
                    </button>

                </form>

            </div>

        </div>

    </main>

</body>
</html>
