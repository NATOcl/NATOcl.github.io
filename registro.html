<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./assest/css/output.css" rel="stylesheet">
  <link href="./assest/css/styles.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
  <title>PetCare | Registro de Usuario</title>
</head>

<body class="bg-[#f4f6f4] min-h-screen flex flex-col justify-between">

  <header class="flex flex-wrap lg:justify-start lg:flex-nowrap z-50 w-full py-4 bg-white border-b border-gray-200">
    <nav class="relative max-w-7xl w-full flex flex-wrap lg:grid lg:grid-cols-12 basis-full items-center px-4 md:px-6 lg:px-8 mx-auto">
      <div class="lg:col-span-3 flex items-center">
        <a class="flex-none rounded-xl text-xl inline-block font-semibold focus:outline-none" href="index.html">
          <img class="h-14 w-auto object-contain" src="./assest/images/isotipo.png" alt="Logo Veterinaria"></a>
      </div>

      <div class="flex items-center gap-x-1 lg:gap-x-2 ms-auto py-1 lg:ps-6 lg:order-3 lg:col-span-3">
        <button type="button" class="size-9.5 relative flex justify-center items-center rounded-xl bg-gray-100 border border-gray-200 text-gray-800 hover:bg-gray-200 focus:outline-none">
          <span class="sr-only">Search</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        </button>
        <button type="button" class="size-9.5 relative flex justify-center items-center rounded-xl bg-gray-100 border border-gray-200 text-gray-800 hover:bg-gray-200 focus:outline-none">
          <span class="sr-only">Cart</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        </button>
        <a href="login.html" class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-xl bg-teal-700 text-white hover:bg-teal-800 focus:outline-none transition">
          Iniciar sesión
        </a>
      </div>

      <div id="hs-pro-hcail" class="hs-collapse hidden overflow-hidden transition-all duration-300 basis-full grow lg:block lg:w-auto lg:basis-auto lg:order-2 lg:col-span-6">
        <div class="flex flex-col gap-y-4 gap-x-0 mt-5 lg:flex-row lg:justify-center lg:items-center lg:gap-y-0 lg:gap-x-7 lg:mt-0">
          <div><a class="relative inline-block text-gray-800 hover:text-teal-700 font-medium" href="index.html">Inicio</a></div>
          <div><a class="relative inline-block text-gray-800 hover:text-teal-700 font-medium" href="productos.html">Productos</a></div>
          <div><a class="relative inline-block text-gray-800 hover:text-teal-700 font-medium" href="aboutus.html">Nosotros</a></div>
          <div><a class="relative inline-block text-gray-800 hover:text-teal-700 font-medium" href="blogs.html">Blogs</a></div>
          <div><a class="relative inline-block text-gray-800 hover:text-teal-700 font-medium" href="contacto.html">Contacto</a></div>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-xl w-full space-y-6">

      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        
        <div class="bg-gray-100 py-3 px-6 border-b border-gray-200">
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-600">Registro de usuario</h3>
        </div>

        <form id="registroForm" class="p-6 sm:p-8 space-y-4" novalidate>
          
          <div id="generalError" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-medium"></div>

          <div>
            <label for="nombreCompleto" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">
              Nombre Completo
            </label>
            <input 
              type="text" 
              id="nombreCompleto" 
              name="nombreCompleto" 
              class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm"
              placeholder="Juan Pérez"
            >
            <p id="errorNombre" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
          </div>

          <div>
            <label for="correo" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">
              Correo
            </label>
            <input 
              type="email" 
              id="correo" 
              name="correo" 
              maxlength="100"
              class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm" 
              placeholder="ejemplo@duoc.cl"
            >
            <p id="errorCorreo" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
          </div>



          <div>
            <label for="contrasena" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">
              Contraseña
            </label>
            <input 
              type="password" 
              id="contrasena" 
              name="contrasena" 
              maxlength="10"
              class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm" 
              placeholder="••••••••"
            >
            <p id="errorContrasena" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
          </div>

          <div>
            <label for="confirmarContrasena" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">
              Confirmar Contraseña
            </label>
            <input 
              type="password" 
              id="confirmarContrasena" 
              name="confirmarContrasena" 
              maxlength="10"
              class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm" 
              placeholder="••••••••"
            >
            <p id="errorConfirmarContrasena" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
          </div>

          <div>
            <label for="telefono" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">
              Teléfono <span class="text-gray-400 font-normal capitalize">(opcional)</span>
            </label>
            <input 
              type="tel" 
              id="telefono" 
              name="telefono" 
              class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm" 
              placeholder="+56 9 1234 5678"
            >
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
            <div>
              <select 
                id="region" 
                name="region" 
                class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm"
              >
                <option value="">-- Seleccione la región --</option>
                <option value="RM">Región Metropolitana de Santiago</option>
                <option value="AR">Región de la Araucanía</option>
                <option value="NU">Región de Ñuble</option>
              </select>
              <p id="errorRegion" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
            </div>

            <div>
              <select 
                id="comuna" 
                name="comuna" 
                class="w-full h-14 px-4 text-sm text-gray-800 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#007a6e] outline-none transition shadow-sm"
              >
                <option value="">-- Seleccione la comuna --</option>
                <option value="PE">Peñalolén</option>
                <option value="SJ">San Joaquín</option>
                <option value="PA">Puente Alto</option>
                <option value="NU">Ñuñoa</option>
                <option value="LR">La Reina</option>
                <option value="LF">La Florida</option>
                <option value="LE">Lo Espejo</option>
                <option value="CE">Cerrillos</option>
                <option value="CN">Cerro Navia</option>
                <option value="CI">Conchalí</option>
                <option value="EB">El Bosque</option>
                <option value="VNZ">Estacion Central</option>
                <option value="HU">Huechuraba</option>
                <option value="IN">Independencia</option>
                <option value="LC">La Cisterna</option>
                <option value="SM">San Miguel</option>
              </select>
              <p id="errorComuna" class="hidden mt-1 text-xs text-red-600 font-medium"></p>
            </div>
          </div>

          <div class="pt-4 flex justify-center">
            <button 
              type="submit" 
              class="w-full  h-14 px-4 text-sm font-semibold rounded-xl bg-teal-700 text-white hover:bg-teal-800 focus:outline-none transition shadow-sm uppercase tracking-wider"
            >
              Registrar
            </button>
          </div>

          <div class="text-center pt-2">
            <p class="text-xs text-gray-500">
              ¿Ya tienes cuenta? 
              <a href="login.html" class="text-teal-700 font-semibold hover:underline">Inicia sesión aquí</a>
            </p>
          </div>

        </form>
      </div>

    </div>
  </main>


  <script src="./assest/js/registro.js"></script>
</body>
</html>
